name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uvx ruff@0.13 check . --output-format github
      - name: Ruff format
        run: uvx ruff@0.13 format --check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
      - name: Gitleaks (fails on any secret, values redacted in the log)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobalert
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # The test suites create their own throwaway *_test / *_apitest databases from this
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobalert
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Tesseract (OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Scraper tests
        working-directory: apps/scrapers
        run: uv run --frozen pytest -q
      - name: Shared (DB, matching, outbox) tests
        working-directory: packages/shared
        run: uv run --frozen pytest -q
      - name: API tests
        working-directory: apps/api
        run: uv run --frozen pytest -q
      - name: Notifier tests
        working-directory: apps/notifier
        run: uv run --frozen pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        image: [scrapers, api, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
