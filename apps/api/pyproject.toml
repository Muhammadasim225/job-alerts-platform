[project]
name = "api"
version = "0.1.0"
description = "SarkariAlert backend API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "fastapi>=0.141.1",
    "redis>=5",
    "shared",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
shared = { path = "../../packages/shared", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
