services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: always
    # AOF persistence: dedup state must survive restarts, or every listing looks new again
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # One-off: bring the Postgres schema up to date (packages/shared migrations)
  migrate:
    image: sarkarialert-scrapers:latest
    command: python -m shared.migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scraper-worker:
    build:
      context: .
      dockerfile: apps/scrapers/Dockerfile
    image: sarkarialert-scrapers:latest
    restart: always
    env_file:
      - .env
    volumes:
      - ./apps/scrapers/data:/app/data
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  scraper-beat:
    # Same image as scraper-worker (built once by that service)
    image: sarkarialert-scrapers:latest
    restart: always
    command: celery -A celery_app beat --loglevel=INFO --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./apps/scrapers/data:/app/data
    depends_on:
      - redis


volumes:
  postgres_data:
  redis_data:
