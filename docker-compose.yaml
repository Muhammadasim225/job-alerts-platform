services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sarkarialert-api:latest
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: always
    # AOF persistence: dedup state must survive restarts, or every listing looks new again
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # One-off: bring the Postgres schema up to date (packages/shared migrations)
  migrate:
    image: sarkarialert-scrapers:latest
    command: python -m shared.migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scraper-worker:
    build:
      context: .
      dockerfile: apps/scrapers/Dockerfile
    image: sarkarialert-scrapers:latest
    restart: always
    # scrape (1 at a time via lock) + process (parallel OCR) + default (reminders, housekeeping)
    command: >
      sh -c "celery -A celery_app worker -Q scrape,process,default
      --concurrency=$${WORKER_CONCURRENCY:-4} --hostname=worker@%h --loglevel=INFO"
    env_file:
      - .env
    volumes:
      - ./apps/scrapers/data:/app/data
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d worker@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 3

  scraper-beat:
    # Same image as scraper-worker (built once by that service)
    image: sarkarialert-scrapers:latest
    restart: always
    command: celery -A celery_app beat --loglevel=INFO --schedule=/app/data/celerybeat-schedule
    env_file:
      - .env
    volumes:
      - ./apps/scrapers/data:/app/data
    depends_on:
      - redis
      - scraper-worker

  # Celery dashboard: queues, workers, task history, failures. Official image, no code
  # coupling. Bound to localhost only and password-protected (FLOWER_BASIC_AUTH=user:pass).
  flower:
    image: mher/flower:2.0
    restart: always
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH=user:password in .env}
      FLOWER_PORT: "5555"
      FLOWER_PERSISTENT: "False"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
